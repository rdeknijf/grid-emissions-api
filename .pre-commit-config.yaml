repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: beads-export
        name: beads export (.beads/issues.jsonl snapshot, rdeknijf/square#909)
        entry: scripts/bd-export-hook.sh
        language: script
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
