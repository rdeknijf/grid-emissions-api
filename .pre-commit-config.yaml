# prek runs this file (drop-in for pre-commit). `uv run prek install` installs
# both the pre-commit and the pre-push stage.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: beads-export
        name: beads export (.beads/issues.jsonl snapshot, rdeknijf/square#909)
        entry: scripts/bd-export-hook.sh
        language: script
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: ty
        name: ty (type check)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-quick
        name: pytest (quick)
        entry: uv run pytest -x -q --no-cov
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
